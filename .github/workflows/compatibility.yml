name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lanes:
    name: Python ${{ matrix.python }} source compatibility
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install source and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt pytest
      - name: Deterministic DSP golden
        run: python -m pytest -q tests/test_dsp_golden.py
      - name: Offscreen GUI and packaging smoke
        run: python -m pytest -q tests/test_gui_accessibility.py tests/test_packaging.py
      - name: Full source suite
        run: python -m pytest -q

  release-contract:
    name: CPython 3.12 release compatibility contract
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact release and build inputs
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build-lock.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt pytest
      - name: Lock, native, DSP, and security report
        run: python tools/audit_dependencies.py --require-lock-match --output compatibility-report.json
      - name: Release inventory and packaging contracts
        run: python -m pytest -q tests/test_dependency_audit.py tests/test_release_build.py tests/test_license_audit.py tests/test_packaging.py tests/test_safe_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: compatibility-report.json
          if-no-files-found: ignore
